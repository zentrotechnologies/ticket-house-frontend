<div class="layout">
  <!-- CASE 1: SUPER ADMIN (role_id 1) - Show sidebar + admin header -->
  <ng-container *ngIf="isSuperAdmin()">
    <app-sidebar (toggle)="onSidebarToggle($event)"></app-sidebar>
    <app-header [isSidebarCollapsed]="isSidebarCollapsed" [isFullWidth]="false"></app-header>
    
    <main class="main-content" [class.sidebar-collapsed]="isSidebarCollapsed">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
  </ng-container>

  <!-- CASE 2: ORGANIZER (role_id 2) - NO sidebar, just header (full width) -->
  <ng-container *ngIf="isOrganizer()">
    <app-header [isSidebarCollapsed]="false" [isFullWidth]="true"></app-header>
    
    <main class="main-content no-sidebar">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
  </ng-container>

  <!-- CASE 3: EVERYONE ELSE - Audience users (role_id 3) AND Public users (not logged in) -->
  <ng-container *ngIf="isAudienceOrPublic()">
    <div class="audience-page audience-body">
      <!-- Common User Header - ALWAYS visible for non-admin users -->
      <app-user-header></app-user-header>
      
      <!-- Main content WITHOUT any header (header removed from individual components) -->
      <main class="audience-main-content">
        <div class="content-wrapper">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </ng-container>
</div>
